on:
  - push
name: test
jobs:
  test:
    strategy:
      matrix:
        go-version:
          - "1.24"
          - "1.25"
          - "1.26"
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test
        run: go test -timeout 2m ./...
